name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag and test
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('manifest.json'))['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must match the manifest version.')
          PY
          go test -race -cover ./...
          go vet ./...
      - name: Install pinned TinyGo
        run: |
          curl -fsSL https://github.com/tinygo-org/tinygo/releases/download/v0.40.1/tinygo0.40.1.linux-amd64.tar.gz -o "$RUNNER_TEMP/tinygo.tar.gz"
          echo "064fc0c07f4d71f7369b168c337caa88ef32a6b00b16449cea44790ccadfc2b4  $RUNNER_TEMP/tinygo.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
      - name: Build and inspect release assets
        run: |
          ./scripts/build.sh
          python3 scripts/check_public.py --tracked
          python3 scripts/package_source.py
          cd dist
          sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          elif test -f "$notes"; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/navidrome-upcoming-releases-plugin.ndp dist/navidrome-upcoming-releases-plugin-source.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
